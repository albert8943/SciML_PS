jtex: v1
title: SciML for PS Book PDF
description: Navy/teal book-style PDF template for Scientific Machine Learning (SciML) for Power Systems (PS) notes
version: 1.0.0
# jtex template package itself (code under MIT). PDF *content* is CC BY-NC-SA 4.0.
license: MIT
authors:
  - name: Albert Poulose

tags:
  - book
  - course-notes
  - sciml
parts:
  - id: abstract
    description: >
      Optional short abstract or overview placed after the title page.
doc:
  - id: title
    required: true
  - id: subtitle
  - id: authors
    required: true
  - id: date
  - id: bibliography
options:
  - id: link
    type: string
    title: Footnote Link
    description: >
      Optional footnote with a link back to the online notes.
files:
  - template.tex
  - gitinfo.tex
packages:
  - datetime
  - graphicx
  - hyperref
  - natbib
  - xcolor
  - amsmath
  - amssymb
  - mathtools
  - booktabs
  - array
  - longtable
  - microtype
  - titlesec
  - fancyhdr
  - enumitem
  - tcolorbox
  - framed
  - geometry
  - fontenc
  - lmodern
  - url
