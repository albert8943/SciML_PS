[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sciml-ps"
version = "0.0.1"
description = "Teaching utilities for Scientific Machine Learning (SciML) for Power Systems (PS)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
