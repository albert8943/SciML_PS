site:
  template: book-theme
  options:
    hide_toc: false
    # Top-left navbar: short form. Without logo_text, theme falls back to “Made with MyST”.
    logo_text: SciML for PS
    logo_url: /
    logo_alt: Scientific Machine Learning (SciML) for Power Systems (PS)
  # Sidebar footer replaces the bottom “Made with MyST” badge; site footer holds quiet credit.
  parts:
    primary_sidebar_footer: book/_site/primary_sidebar_footer.md
    footer: book/_site/site_footer.md
    # Pre-1.0 banner (book-theme announcement slot when supported; footer also carries the notice).
    announcement: book/_site/announcement.md
  # Navbar actions (EECS 245–style). Replace Feedback URL with a Google Form when ready.
  # Absolute http(s) URLs open in a new tab; relative /paths replace the current tab (mystmd#2788).
  # Local preview PDF is on the content server (port 3100). Before public deploy, switch PDF url
  # to your hosted absolute PDF URL (still http(s) so it stays a new tab).
  actions:
    - title: Start here
      url: /start-here
    - title: Outline
      url: /outline
    - title: PDF
      url: http://localhost:3100/exports/sciml_ps_notes.pdf
    - title: Feedback
      url: https://github.com/albert8943/SciML_PS/issues/new/choose
    - title: Contribute
      url: /contribute
    - title: GitHub
      url: https://github.com/albert8943/SciML_PS
    # Uncomment when a public course portal exists:
    # - title: Course website
    #   url: https://example.org/sciml-ps-course/
