# Fail pull requests whose commits are not DCO signed-off.
# Prefer also installing the GitHub DCO App after the repo is public.
name: DCO

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on PR commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            msg=$(git log -1 --format=%B "$sha")
            if ! echo "$msg" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $sha is missing a Signed-off-by line (use git commit -s)"
              missing=1
            else
              echo "OK $sha"
            fi
          done < <(git rev-list --no-merges "${BASE}..${HEAD}")
          if [ "$missing" -ne 0 ]; then
            echo "DCO check failed. See CONTRIBUTING.md"
            exit 1
          fi
          echo "All commits are DCO signed-off."
