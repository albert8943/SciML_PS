# Build the Jupyter Book 2 site (and PDF) on push to master.
# Pages deploy is manual/opt-in until a public URL is chosen — see docs/guides/site_hosting.md
name: build-book

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Jupyter Book 2
        run: |
          python -m pip install --upgrade pip
          pip install "jupyter-book>=2.0.0a0"

      - name: Build HTML site
        run: jupyter book build

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: sciml-ps-book-html
          path: |
            _build
            !_build/templates
          if-no-files-found: warn

  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-plain-generic \
            lmodern

      - name: Install Jupyter Book 2
        run: |
          python -m pip install --upgrade pip
          pip install "jupyter-book>=2.0.0a0"

      - name: Build PDF
        run: python scripts/build_pdf.py

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: sciml-ps-notes-pdf
          path: exports/sciml_ps_notes.pdf
          if-no-files-found: warn
